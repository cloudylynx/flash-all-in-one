name: flashallinone
description: "Flash All In One - 一站式 Android 刷机与设备管理工具箱"
publish_to: 'none'
version: 1.4.1+6

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  cupertino_icons: ^1.0.8
  window_manager: ^0.4.3
  url_launcher: ^6.3.0
  file_picker: ^8.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/apk/
    - assets/tools/windows/common/
    - assets/tools/windows/ota/
    - assets/tools/windows/recovery/
    - assets/tools/windows/rockchip/
    - assets/tools/windows/esp/
    - assets/tools/windows/pico/
    - assets/tools/windows/stm32/
    - assets/tools/windows/rpi/
    - assets/tools/windows/arduino/
    - assets/tools/windows/
    - assets/tools/windows/scrcpy/
    - assets/tools/windows/mtk/
    - assets/tools/windows/img/
    - assets/tools/windows/mi8g3/
    - assets/tools/windows/qdl/
    - assets/tools/windows/f2fs/
    - assets/tools/windows/payload/
    - assets/tools/windows/sprd/
    - assets/tools/windows/samloader/
    - assets/tools/windows/uad/
    - assets/tools/linux/
    - assets/tools/linux/qdl/
    - assets/tools/linux/uad/
    - assets/tools/linux/samloader/
    - assets/tools/linux/ota/
    - assets/tools/linux/recovery/
    - assets/tools/linux/rockchip/
    - assets/tools/linux/allwinner/
    - assets/tools/linux/esp/
    - assets/tools/linux/pico/
    - assets/tools/linux/stm32/
    - assets/tools/linux/stm32/chips/
    - assets/tools/linux/rpi/
    - assets/tools/linux/arduino/
    - assets/tools/apk/
    - assets/tools/kernelsu/
