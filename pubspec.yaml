name: flashallinone
description: "Flash All In One - 一站式 Android 刷机与设备管理工具箱"
publish_to: 'none'
version: 2.2.0+15

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  path: ^1.9.1
  path_provider: ^2.1.5
  archive: ^4.0.7
  image: ^4.3.0
  shared_preferences: ^2.3.3
  cupertino_icons: ^1.0.8
  window_manager: ^0.4.3
  url_launcher: ^6.3.0
  file_picker: ^8.1.6
  package_info_plus: ^9.0.1
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
